# Isolated test infrastructure for the real-database acceptance suite (PR-0).
#
# The acceptance baseline deliberately runs against real PostgreSQL, Redis and
# MinIO — not mocks — because source-string assertions cannot catch protocol
# breaks like "backend requires a version precondition, frontend never sends
# one". Everything here listens on loopback and uses ports distinct from the
# main compose file so the test environment can run alongside a dev deployment.
#
# Usage:
#   docker compose -f docker-compose.test.yml up -d
#   ./scripts/test-env.sh migrate   # apply migrations against the test DB
#   npm run test:integration
#   docker compose -f docker-compose.test.yml down -v
version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: paperforge
      POSTGRES_PASSWORD: paperforge-test-password
      POSTGRES_DB: paperforge_test
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperforge -d paperforge_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"
    command: redis-server --appendonly no --maxmemory 128mb --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    # minio/minio on Docker Hub requires authentication for anonymous pulls;
    # the Bitnami-legacy image is a directly equivalent drop-in for the test
    # stack and pulls without credentials.
    image: bitnamilegacy/minio:latest
    user: "0"
    environment:
      MINIO_ROOT_USER: paperforge
      MINIO_ROOT_PASSWORD: paperforge-test-password
      MINIO_DEFAULT_BUCKETS: paperforge-test
    ports:
      - "127.0.0.1:9010:9000"
    command: minio server /data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped
