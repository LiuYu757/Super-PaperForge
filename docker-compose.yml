version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: paperforge
      # No weak default. Compose fails to start if POSTGRES_PASSWORD is unset.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: paperforge
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperforge"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G

  redis:
    image: redis:7-alpine
    # Bound to loopback: the queue is internal infrastructure and must not be
    # reachable from the user network. Only nginx publishes a port.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --save 120 1
      --maxmemory 512mb
      --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
    # API and console on loopback only — the console in particular must never
    # face the user network.
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    profiles:
      - dev
    deploy:
      resources:
        limits:
          memory: 256M

  worker:
    build: ./worker
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
      MINIO_BUCKET: paperforge
      DATABASE_URL: postgresql://paperforge:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/paperforge
      COMPILE_CONCURRENCY: ${COMPILE_CONCURRENCY:-1}
      NODE_ENV: ${NODE_ENV:-production}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
      replicas: ${WORKER_REPLICAS:-1}

  websocket:
    build: ./websocket
    # Loopback only: nginx proxies /ws to this service. Exposing 4001 directly
    # would bypass TLS termination and the proxy's Origin checks.
    ports:
      - "127.0.0.1:4001:4001"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      WS_PORT: "4001"
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET must be set}
      DATABASE_URL: postgresql://paperforge:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/paperforge
      REDIS_URL: redis://redis:6379
      # PR-1 R10: versioned (default) rejects the legacy Yjs write channel.
      EDITOR_SYNC_MODE: ${EDITOR_SYNC_MODE:-versioned}
      NODE_ENV: ${NODE_ENV:-production}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      # Version history must survive container rebuilds. Without this the DB
      # keeps version rows whose Git content has vanished.
      - git_repos:/var/lib/paperforge/git
    environment:
      DATABASE_URL: postgresql://paperforge:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/paperforge
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
      MINIO_BUCKET: paperforge
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET must be set}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set}
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      # Self-hosting defaults. See .env.example for the full list.
      PAPERFORGE_MODE: ${PAPERFORGE_MODE:-selfhost}
      COMPILATION_BACKEND: ${COMPILATION_BACKEND:-local}
      ALLOW_REMOTE_COMPILE: ${ALLOW_REMOTE_COMPILE:-false}
      COMPILE_CONCURRENCY: ${COMPILE_CONCURRENCY:-1}
      GIT_REPOS_PATH: /var/lib/paperforge/git
      # Prefer a same-origin wss:// URL derived by the browser. Only set WS_URL
      # when the collaboration server lives on a different host.
      NEXT_PUBLIC_WS_URL: ${WS_URL:-}
      # PR-0/PR-1 guard: external live writes (changeset apply/revert) stay
      # closed until the unified mutation core and the versioned editor protocol
      # are proven. Operators who run the new editor may open them with =true.
      ENABLE_EXTERNAL_APPLY: ${ENABLE_EXTERNAL_APPLY:-false}
      NODE_ENV: ${NODE_ENV:-production}
    healthcheck:
      # node is always present in the runtime image; curl is not installed in
      # node:*-alpine, so the previous curl-based probe could never succeed.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G

  nginx:
    image: nginx:alpine
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      app:
        condition: service_healthy
      websocket:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  postgres_data:
  redis_data:
  minio_data:
  git_repos:
